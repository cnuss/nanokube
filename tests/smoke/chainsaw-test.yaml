apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: smoke
spec:
  description: Apply the chainsaw-kube smoke manifest and assert the deployment becomes available.
  steps:
    - name: apply-smoke-resources
      try:
        - apply:
            file: https://raw.githubusercontent.com/cnuss/chainsaw-kube/refs/heads/main/smoke/resources.yaml
    - name: assert-deployment-available
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: smoke-deploy
              status:
                availableReplicas: 1
                readyReplicas: 1
    - name: assert-pod-logs
      description: |
        Exercises kubectl logs end-to-end (kubelet 206 + apiserver
        StatusCode forwarding + cloudflare-edge flush) by checking
        the assert container's most recent log line.
      try:
        - script:
            content: |
              line=$(kubectl logs -n $NAMESPACE -l app=smoke-deploy -c assert --tail=1)
              test "$line" = "all checks passed, creating /mnt/pvc/ok"
            check:
              ($error == null): true
