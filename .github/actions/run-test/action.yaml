name: Run Test
description: Download artifact, start nanokube, run a chainsaw suite, upload logs

inputs:
  suite:
    description: "Chainsaw test suite under tests/ (e.g. smoke, sanity)"
    required: true
  artifact:
    description: "Name of the build artifact to download"
    required: true
  log-name:
    description: "Name for the uploaded log artifact"
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup

    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact }}

    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - shell: bash
      run: make build ARTIFACT=${{ inputs.artifact }}

    - shell: bash
      run: ./nanokube start

    - shell: bash
      run: make test SUITE=${{ inputs.suite }}

    - if: always()
      shell: bash
      run: ./nanokube stop || true

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ inputs.log-name }}
        path: ~/.nanokube
