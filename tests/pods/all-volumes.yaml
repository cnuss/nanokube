apiVersion: v1
kind: ConfigMap
metadata:
  name: test-cm
data:
  greeting: hello
  target: world
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-projected-cm
data:
  color: blue
  lang: go
---
apiVersion: v1
kind: Secret
metadata:
  name: test-secret
stringData:
  username: admin
  password: s3cret
---
apiVersion: v1
kind: Pod
metadata:
  name: all-volumes
  labels:
    app: all-volumes
    test: "true"
  annotations:
    description: "volume smoke test"
spec:
  containers:
  - name: busybox
    image: busybox:latest
    command: ["/bin/sh", "-c"]
    args:
    - |
      show() {
        printf "  %-20s = %s\n" "$1" "$2"
      }
      writable() {
        if touch "$1/.probe" 2>/dev/null; then rm "$1/.probe"; echo yes; else echo no; fi
      }

      echo "=== EmptyDir (default) ==="
      echo "  mount: /mnt/emptydir-default"
      echo "  writable: $(writable /mnt/emptydir-default)"
      echo ""

      echo "=== EmptyDir (memory) ==="
      echo "  mount: /mnt/emptydir-memory"
      echo "  type:  $(mount | grep emptydir-memory | awk '{print $5}')"
      echo "  writable: $(writable /mnt/emptydir-memory)"
      echo ""

      echo "=== Projected ==="
      echo "  mount: /mnt/projected"
      show "token" "$(cat /mnt/projected/token 2>/dev/null | cut -c1-32)..."
      show "namespace" "$(cat /mnt/projected/namespace 2>/dev/null)"
      echo "  labels:"
      sed 's/^/    /' /mnt/projected/labels 2>/dev/null; echo ""
      show "configmap/color" "$(cat /mnt/projected/configmap/color 2>/dev/null)"
      show "configmap/lang" "$(cat /mnt/projected/configmap/lang 2>/dev/null)"
      echo "  writable: $(writable /mnt/projected)"
      echo ""

      echo "=== Secret ==="
      echo "  mount: /mnt/secret"
      show "username" "$(cat /mnt/secret/username 2>/dev/null)"
      show "password" "$(cat /mnt/secret/password 2>/dev/null)"
      echo "  writable: $(writable /mnt/secret)"
      echo ""

      echo "=== ConfigMap ==="
      echo "  mount: /mnt/configmap"
      show "greeting" "$(cat /mnt/configmap/greeting 2>/dev/null)"
      show "target" "$(cat /mnt/configmap/target 2>/dev/null)"
      echo "  writable: $(writable /mnt/configmap)"
      echo ""

      echo "=== DownwardAPI ==="
      echo "  mount: /mnt/downwardapi"
      show "pod-name" "$(cat /mnt/downwardapi/pod-name 2>/dev/null)"
      show "pod-namespace" "$(cat /mnt/downwardapi/pod-namespace 2>/dev/null)"
      echo "  labels:"
      sed 's/^/    /' /mnt/downwardapi/labels 2>/dev/null; echo ""
      show "annotation" "$(grep '^description=' /mnt/downwardapi/annotations 2>/dev/null)"
      echo "  writable: $(writable /mnt/downwardapi)"
      echo ""

      echo "=== HostPath ==="
      echo "  mount: /mnt/hostpath"
      echo "  type:  directory"
      echo "  writable: $(writable /mnt/hostpath)"
      echo ""

      echo "=== Mounts ==="
      mount | grep /mnt/ | while read line; do
        printf "  %s\n" "$line"
      done
      echo ""

      echo "=== All volumes OK ==="
      sleep 3600
    volumeMounts:
    - name: emptydir-default
      mountPath: /mnt/emptydir-default
    - name: emptydir-memory
      mountPath: /mnt/emptydir-memory
    - name: projected
      mountPath: /mnt/projected
      readOnly: true
    - name: secret
      mountPath: /mnt/secret
      readOnly: true
    - name: configmap
      mountPath: /mnt/configmap
      readOnly: true
    - name: downwardapi
      mountPath: /mnt/downwardapi
      readOnly: true
    - name: hostpath
      mountPath: /mnt/hostpath
      readOnly: true
  volumes:
  - name: emptydir-default
    emptyDir: {}
  - name: emptydir-memory
    emptyDir:
      medium: Memory
  - name: projected
    projected:
      sources:
      - serviceAccountToken:
          path: token
          expirationSeconds: 3600
      - configMap:
          name: test-projected-cm
          items:
          - key: color
            path: configmap/color
          - key: lang
            path: configmap/lang
      - downwardAPI:
          items:
          - path: labels
            fieldRef:
              fieldPath: metadata.labels
          - path: namespace
            fieldRef:
              fieldPath: metadata.namespace
  - name: secret
    secret:
      secretName: test-secret
  - name: configmap
    configMap:
      name: test-cm
  - name: downwardapi
    downwardAPI:
      items:
      - path: pod-name
        fieldRef:
          fieldPath: metadata.name
      - path: pod-namespace
        fieldRef:
          fieldPath: metadata.namespace
      - path: labels
        fieldRef:
          fieldPath: metadata.labels
      - path: annotations
        fieldRef:
          fieldPath: metadata.annotations
  - name: hostpath
    hostPath:
      path: /tmp/nanokube-hostpath-test
      type: DirectoryOrCreate
