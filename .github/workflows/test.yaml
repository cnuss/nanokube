name: Run Tests

on:
  push:
    branches: ["1.35"]
    paths-ignore:
      - .github/workflows/inspect.yaml
  pull_request:
    branches: ["1.35"]
    paths-ignore:
      - .github/workflows/inspect.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - macos-26-intel
        suite:
          - e2e
          - critest
          - smoke
        runtime: [docker]
    steps:
      - name: Resolve env
        run: |
          echo "NANOKUBE_DATA=$HOME/.nanokube-${{ matrix.suite }}" >> "$GITHUB_ENV"
          echo "MATRIX_HASH=$(echo -n '${{ toJSON(matrix) }}' | sha256sum | cut -c1-8)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: ./.github/actions/setup-docker
        with:
          verbose: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: go-bin-${{ matrix.runner }}-${{ hashFiles('**/go.sum') }}

      - run: make init
      - run: make ${{ matrix.suite }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nanokube-log-${{ env.MATRIX_HASH }}
          path: ${{ env.NANOKUBE_DATA }}/log
