name: test

on:
  push:
    branches: [main, "1.35"]
  pull_request:
    branches: [main, "1.35"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-bin-${{ runner.os }}-critest-v1.35.0-kuttl-0.25.0

      - run: make init
      - run: make critest

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-bin-${{ runner.os }}-critest-v1.35.0-kuttl-0.25.0

      - run: make init
      - run: make e2e
