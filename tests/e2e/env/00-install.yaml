apiVersion: v1
kind: ConfigMap
metadata:
  name: env-cm
data:
  greeting: hello
---
apiVersion: v1
kind: Secret
metadata:
  name: env-secret
stringData:
  password: s3cret
---
apiVersion: v1
kind: Pod
metadata:
  name: env-test
spec:
  containers:
  - name: busybox
    image: busybox:latest
    command: ["sleep", "3600"]
    env:
    - name: PLAIN_VAR
      value: plain-value
    - name: CM_VAR
      valueFrom:
        configMapKeyRef:
          name: env-cm
          key: greeting
    - name: SECRET_VAR
      valueFrom:
        secretKeyRef:
          name: env-secret
          key: password
