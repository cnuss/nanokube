name: Build

on:
  push:
    branches: ["1.36"]
  pull_request:
    branches: ["1.36"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: cnuss/nanokube/.github/actions/test@github
        with:
          suite: smoke
          log-name: nanokube-log-ubuntu-24.04-smoke

  build:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26
          - macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: cnuss/nanokube/.github/actions/build@github
        with:
          runner: ${{ matrix.runner }}

  collect:
    outputs:
      artifacts: ${{ steps.collect.outputs.artifacts }}
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - id: collect
        uses: cnuss/nanokube/.github/actions/collect@github

  release:
    needs: collect
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nanokube-${{ github.ref_name }}-*
          path: artifacts
          merge-multiple: true

      - id: version
        run: |
          BIN=./artifacts/nanokube-${{ github.ref_name }}-$(uname -s)-$(uname -m)
          chmod +x "$BIN"
          echo "version=$("$BIN" --version | sed 's/^Kubernetes //')" >> "$GITHUB_OUTPUT"

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          allowUpdates: true
          removeArtifacts: true
          artifacts: artifacts/*
