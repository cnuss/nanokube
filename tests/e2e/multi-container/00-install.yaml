apiVersion: v1
kind: Pod
metadata:
  name: multi-test
spec:
  containers:
  - name: writer
    image: busybox:latest
    command: ["sh", "-c", "echo shared-data > /shared/data && sleep 3600"]
    volumeMounts:
    - name: shared
      mountPath: /shared
  - name: reader
    image: busybox:latest
    command: ["sleep", "3600"]
    volumeMounts:
    - name: shared
      mountPath: /shared
  volumes:
  - name: shared
    emptyDir: {}
