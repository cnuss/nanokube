apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  # node is Ready
  - script: kubectl get nodes -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].status}' | grep -q True
  # node has standard kubernetes labels
  - script: |
      expected=$(uname -s | tr '[:upper:]' '[:lower:]')
      actual=$(kubectl get nodes -o jsonpath='{.items[0].metadata.labels.kubernetes\.io/os}')
      test "$actual" = "$expected"
  - script: |
      expected=$(uname -m | sed 's/x86_64/amd64/' | sed 's/aarch64/arm64/')
      actual=$(kubectl get nodes -o jsonpath='{.items[0].metadata.labels.kubernetes\.io/arch}')
      test "$actual" = "$expected"
