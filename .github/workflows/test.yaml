name: Run Tests

on:
  push:
    branches: ["1.35"]
    paths-ignore:
      - .github/workflows/inspect.yaml
  pull_request:
    branches: ["1.35"]
    paths-ignore:
      - .github/workflows/inspect.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/.build.yaml

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    env:
      ARTIFACT: ${{ fromJSON(needs.build.outputs.artifacts)['ubuntu-24.04'] }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: ./.github/actions/setup-docker
        with:
          verbose: true

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}


      - run: make smoke ARTIFACT=${{ env.ARTIFACT }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nanokube-log-smoke
          path: ~/.nanokube-smoke/log

  conformance:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    env:
      ARTIFACT: ${{ fromJSON(needs.build.outputs.artifacts)['ubuntu-24.04'] }}
    strategy:
      fail-fast: false
      matrix:
        suite: [critest, e2e]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: ./.github/actions/setup-docker
        with:
          verbose: true

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}


      - run: make ${{ matrix.suite }} ARTIFACT=${{ env.ARTIFACT }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nanokube-log-${{ matrix.suite }}
          path: ~/.nanokube-${{ matrix.suite }}/log

  cross-platform:
    needs: [build, conformance]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04-arm
          - macos-26-intel
        suite: [smoke, critest, e2e]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: ./.github/actions/setup-docker
        with:
          verbose: true

      - uses: actions/download-artifact@v4
        with:
          name: ${{ fromJSON(needs.build.outputs.artifacts)[matrix.runner] }}


      - run: make ${{ matrix.suite }} ARTIFACT=${{ fromJSON(needs.build.outputs.artifacts)[matrix.runner] }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nanokube-log-${{ matrix.runner }}-${{ matrix.suite }}
          path: ~/.nanokube-${{ matrix.suite }}/log
