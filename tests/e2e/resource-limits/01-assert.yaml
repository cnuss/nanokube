apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  # verify resource requests and limits are set on the pod spec
  - script: |
      cpu_req=$(kubectl get pod --namespace $NAMESPACE resource-test -o jsonpath='{.spec.containers[0].resources.requests.cpu}')
      test "$cpu_req" = "50m"
  - script: |
      mem_limit=$(kubectl get pod --namespace $NAMESPACE resource-test -o jsonpath='{.spec.containers[0].resources.limits.memory}')
      test "$mem_limit" = "64Mi"
