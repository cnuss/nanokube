name: "Nanokube"
description: "Run Nanokube in GitHub Actions"
author: "cnuss"
branding:
  icon: "box"
  color: "blue"
inputs:
  verbosity:
    description: "klog verbosity level passed to nanokube start (-v)"
    required: false
    default: "0"
runs:
  using: "composite"
  steps:
    # Derive the repo (owner/name) and version (ref) from the path GitHub
    # checked this action out to, so nothing is hardcoded if the repo moves.
    #   GITHUB_ACTION_PATH = .../_actions/<owner>/<repo>/<ref>
    - id: resolve
      shell: bash
      run: |
        rest=${GITHUB_ACTION_PATH##*/_actions/}   # <owner>/<repo>/<ref>
        version=${rest##*/}                        # <ref>  (tag or branch)
        repo=${rest%/*}                            # <owner>/<repo>
        # Branch refs resolve to the rolling prerelease, tagged <branch>-pre.0;
        # tag refs resolve to the versioned release. Assets keep the bare ref.
        release="$version"
        if git ls-remote --heads "https://github.com/${repo}.git" "$version" | grep -q .; then
          release="${version}-pre.0"
        fi
        echo "repo=$repo"       >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "release=$release" >> "$GITHUB_OUTPUT"
        echo "resolved $repo @ $version (release $release)"

    # Download the prebuilt binary for this runner and put it on PATH. Both tag
    # and branch refs resolve to a release: tags to the versioned release, and
    # branches to a rolling prerelease named after the branch.
    #   https://github.com/<repo>/releases/download/<version>/nanokube-<version>-<OS>-<ARCH>
    - id: install
      shell: bash
      run: |
        repo="${{ steps.resolve.outputs.repo }}"
        version="${{ steps.resolve.outputs.version }}"
        release="${{ steps.resolve.outputs.release }}"
        asset="nanokube-${version}-$(uname -s)-$(uname -m)"
        url="https://github.com/${repo}/releases/download/${release}/${asset}"
        bindir="${RUNNER_TEMP}/nanokube-bin"
        mkdir -p "$bindir"
        echo "fetching $url"
        curl -fsSL -o "$bindir/nanokube" "$url"
        chmod +x "$bindir/nanokube"
        echo "$bindir" >> "$GITHUB_PATH"
        "$bindir/nanokube" --version

    - id: start
      shell: bash
      run: |
        args=""
        if [ "${{ inputs.verbosity }}" != "0" ]; then
          args="-v=${{ inputs.verbosity }}"
        fi
        nanokube start $args
