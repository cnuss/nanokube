apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: smoke
spec:
  description: Apply the chainsaw-kube smoke manifest and assert the deployment becomes available.
  steps:
    - name: apply-smoke-resources
      try:
        - apply:
            file: https://raw.githubusercontent.com/cnuss/chainsaw-kube/refs/heads/main/smoke/resources.yaml
    - name: assert-deployment-available
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: smoke-deploy
              status:
                availableReplicas: 1
                readyReplicas: 1
    - name: assert-pod-logs
      description: kubectl logs end-to-end — one-shot tail and --follow.
      try:
        - script:
            content: |
              line=$(kubectl logs -n $NAMESPACE -l app=smoke-deploy -c assert --tail=1)
              test "$line" = "all checks passed, creating /mnt/pvc/ok"
            check:
              ($error == null): true
        - script:
            content: |
              kubectl logs -n $NAMESPACE -l app=smoke-deploy -c httpd --follow --tail=0 \
                | grep -m3 "response:200"
            check:
              ($error == null): true
