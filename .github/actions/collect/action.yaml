name: Collect
description: Download per-runner build metadata and aggregate into a runner -> artifact JSON map

outputs:
  artifacts:
    description: "JSON map of runner -> artifact name"
    value: ${{ steps.artifacts.outputs.map }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - uses: actions/download-artifact@v4
      with:
        pattern: build-meta-*
        path: meta
        merge-multiple: true

    - id: artifacts
      shell: bash
      run: |
        map=$(jq -sc 'reduce .[] as $item ({}; . + {($item.runner): $item.artifact})' meta/*.json)
        echo "map=$map" >> "$GITHUB_OUTPUT"
