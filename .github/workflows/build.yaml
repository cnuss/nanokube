name: Build

on:
  push:
    branches: ["1.36"]
  pull_request:
    branches: ["1.36"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: cnuss/nanokube/.github/actions/test@github
        with:
          suite: smoke
          log-name: nanokube-log-ubuntu-24.04-smoke

  build:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26
          - macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: cnuss/nanokube/.github/actions/build@github
        with:
          runner: ${{ matrix.runner }}

  collect:
    outputs:
      artifacts: ${{ steps.collect.outputs.artifacts }}
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - id: collect
        uses: cnuss/nanokube/.github/actions/collect@github

  # Two releases per push, published in parallel:
  #   branch  -> rolling prerelease named after the branch, branch-named assets
  #              (nanokube-<branch>-<OS>-<ARCH>); lets the action install a
  #              branch ref by download instead of building from source.
  #   version -> versioned release, assets renamed to the captured version.
  # ncipollo/release-action's allowUpdates refreshes the assets but leaves the
  # git tag pinned to its original commit, so each leg force-moves its tag first.
  release:
    needs: collect
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: branch
            prerelease: true
          - kind: version
            prerelease: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: nanokube-${{ github.ref_name }}-*
          path: artifacts
          merge-multiple: true

      - id: tag
        run: |
          if [ "${{ matrix.kind }}" = "version" ]; then
            BIN=./artifacts/nanokube-${{ github.ref_name }}-$(uname -s)-$(uname -m)
            chmod +x "$BIN"
            tag=$("$BIN" --version | sed 's/^Kubernetes //')
            # Rename the assets from the branch ref to the captured version.
            for f in ./artifacts/nanokube-${{ github.ref_name }}-*; do
              mv "$f" "${f/nanokube-${{ github.ref_name }}-/nanokube-$tag-}"
            done
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Move tag to current commit
        run: |
          git tag -f "${{ steps.tag.outputs.tag }}"
          git push -f origin "refs/tags/${{ steps.tag.outputs.tag }}"

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ matrix.prerelease }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: artifacts/*
