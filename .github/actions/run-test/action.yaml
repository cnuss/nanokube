name: Run Test
description: Download artifact, start nanokube, run a chainsaw suite, upload logs

inputs:
  suite:
    description: "Chainsaw test suite under tests/ (e.g. smoke, sanity)"
    required: true
  artifact:
    description: "Name of the build artifact to download"
    required: true
  log-name:
    description: "Name for the uploaded log artifact"
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup

    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact }}

    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - shell: bash
      run: make build ARTIFACT=${{ inputs.artifact }}

    - shell: bash
      run: ./nanokube start -vvv

    - shell: bash
      env:
        SLOW: ${{ runner.os == 'macOS' }}
      run: |
        ARGS=""
        if [ "$SLOW" = "true" ]; then
          ARGS="--apply-timeout=1h --assert-timeout=1h --cleanup-timeout=1h --delete-timeout=1h --error-timeout=1h --exec-timeout=1h"
        fi
        make test SUITE=${{ inputs.suite }} CHAINSAW_ARGS="$ARGS"

    - if: always()
      shell: bash
      run: ./nanokube stop || true

    - if: always()
      shell: bash
      run: |
        mkdir -p nanokube-logs/logs
        cp "$HOME/.nanokube/nanokube.log" nanokube-logs/ 2>/dev/null || true
        cp -R "$HOME/.nanokube/logs/." nanokube-logs/logs/ 2>/dev/null || true

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ inputs.log-name }}
        path: nanokube-logs
