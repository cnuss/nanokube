name: Build
description: Build nanokube for the current runner, upload binary + metadata artifacts

inputs:
  runner:
    description: "Runner label (e.g. ubuntu-24.04). Used in cache key and metadata filename."
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - uses: actions/cache@v5
      with:
        path: ~/go/bin
        key: go-bin-${{ inputs.runner }}-${{ hashFiles('**/go.sum') }}

    - shell: bash
      run: make build

    - id: platform
      shell: bash
      run: |
        NAME="nanokube-${{ github.ref_name }}-$(uname -s)-$(uname -m)"
        mv nanokube $NAME
        echo "name=$NAME" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.platform.outputs.name }}
        path: ${{ steps.platform.outputs.name }}

    - shell: bash
      run: echo '{"runner":"${{ inputs.runner }}","artifact":"${{ steps.platform.outputs.name }}"}' > build-meta-${{ inputs.runner }}.json

    - uses: actions/upload-artifact@v7
      with:
        name: build-meta-${{ inputs.runner }}
        path: build-meta-${{ inputs.runner }}.json
