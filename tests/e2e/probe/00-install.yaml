apiVersion: v1
kind: Pod
metadata:
  name: probe-liveness
spec:
  containers:
  - name: busybox
    image: busybox:latest
    command: ["sh", "-c", "touch /tmp/healthy && sleep 3600"]
    livenessProbe:
      exec:
        command: ["cat", "/tmp/healthy"]
      initialDelaySeconds: 1
      periodSeconds: 3
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-readiness
spec:
  containers:
  - name: busybox
    image: busybox:latest
    command: ["sh", "-c", "touch /tmp/ready && sleep 3600"]
    readinessProbe:
      exec:
        command: ["cat", "/tmp/ready"]
      initialDelaySeconds: 1
      periodSeconds: 3
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-startup
spec:
  containers:
  - name: busybox
    image: busybox:latest
    command: ["sh", "-c", "touch /tmp/started && sleep 3600"]
    startupProbe:
      exec:
        command: ["cat", "/tmp/started"]
      initialDelaySeconds: 1
      periodSeconds: 3
      failureThreshold: 5
