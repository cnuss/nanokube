name: Run Tests

on:
  push:
    branches: ["1.35"]
  pull_request:
    branches: ["1.35"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        runner:
          # - ubuntu-latest
          - macos-26-intel
        suite: [reviewable]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - uses: docker/setup-docker-action@v5

      - name: Docker spot checks
        run: |
          echo "=== docker version ==="
          docker version
          echo "=== docker info ==="
          docker info
          echo "=== docker context inspect ==="
          docker context inspect
          echo "=== docker network ls ==="
          docker network ls
          echo "=== docker network inspect bridge ==="
          docker network inspect bridge || echo "(no default bridge)"
          echo "=== iptables version ==="
          sudo iptables --version || echo "(iptables not available)"
          echo "=== iptables filter chains ==="
          sudo iptables -t filter -L -n --line-numbers 2>&1 || echo "(iptables list failed)"
          echo "=== iptables nat chains ==="
          sudo iptables -t nat -L -n --line-numbers 2>&1 || echo "(iptables nat list failed)"
          echo "=== dockerd config ==="
          cat /etc/docker/daemon.json 2>/dev/null || echo "(no daemon.json)"
          cat ~/.config/docker/daemon.json 2>/dev/null || echo "(no user daemon.json)"
          echo "=== env ==="
          env | sort

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: go-bin-${{ matrix.runner }}-${{ hashFiles('**/go.sum') }}

      - run: make init

      - run: make ${{ matrix.suite }} V=1
