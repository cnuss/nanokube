name: Run Tests

on:
  push:
    branches: ["1.35"]
  pull_request:
    branches: ["1.35"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-26-intel
        suite: [e2e, critest]
        runtime: [docker]
        rootless: [true, false]
        exclude:
          - runner: macos-26-intel
            rootless: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - uses: docker/setup-docker-action@v5
        if: matrix.runtime == 'docker'
        with:
          rootless: ${{ matrix.rootless }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: go-bin-${{ matrix.runner }}-${{ hashFiles('**/go.sum') }}

      - run: make init

      - run: make ${{ matrix.suite }}

      - name: Copy nanokube log
        if: always()
        run: |
          mkdir -p /tmp/nanokube-logs
          cp ~/.nanokube-${{ matrix.suite }}/log /tmp/nanokube-logs/nanokube.log 2>/dev/null || echo "No log found"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanokube-log-${{ matrix.runner }}-${{ matrix.suite }}-${{ matrix.runtime }}-rootless-${{ matrix.rootless }}
          path: /tmp/nanokube-logs/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanokube-data-${{ matrix.runner }}-${{ matrix.suite }}-${{ matrix.runtime }}-rootless-${{ matrix.rootless }}
          path: ${{ env.HOME }}/.nanokube-${{ matrix.suite }}/
