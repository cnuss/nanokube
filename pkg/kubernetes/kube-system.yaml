---
apiVersion: v1
kind: Pod
metadata:
  name: control-plane
  namespace: kube-system
spec:
  containers:
    - name: kube-apiserver
      image: registry.k8s.io/kube-apiserver
      ports:
        - containerPort: 443
          hostPort: 443
          protocol: TCP
      env:
        - name: ADVERTISE_ADDRESS
          value: "127.0.0.1"
        - name: HOSTNAME
          value: "localhost"
        - name: SERVICE_CLUSTER_IP_RANGE
          value: "10.0.0.0/24"
      command:
        - kube-apiserver
        - --bind-address=0.0.0.0
        - --secure-port=443
        - --advertise-address=$(ADVERTISE_ADDRESS)
        - --service-cluster-ip-range=$(SERVICE_CLUSTER_IP_RANGE)
        - --external-hostname=$(HOSTNAME)
        - --etcd-servers=https://$(HOSTNAME):2379
        - --etcd-cafile=/etc/kubernetes/ca.crt
        - --etcd-certfile=/etc/kubernetes/ca.crt
        - --etcd-keyfile=/etc/kubernetes/ca.key
        - --service-account-issuer=https://kubernetes.default.svc.cluster.local
        - --allow-privileged=true
        - --authorization-mode=Node,RBAC
        - --enable-bootstrap-token-auth
        - --audit-log-path=-
        - --audit-log-format=legacy
        - --disable-http2-serving
        - --endpoint-reconciler-type=none
        - --watch-cache=false
        - --shutdown-delay-duration=0s
        - --tls-cert-file=/etc/kubernetes/ca.crt
        - --tls-private-key-file=/etc/kubernetes/ca.key
        - --client-ca-file=/etc/kubernetes/ca.crt
        - --service-account-key-file=/etc/kubernetes/ca.crt
        - --service-account-signing-key-file=/etc/kubernetes/ca.key
        - --kubelet-client-certificate=/etc/kubernetes/ca.crt
        - --kubelet-client-key=/etc/kubernetes/ca.key
      volumeMounts:
        - name: etc-kubernetes
          mountPath: /etc/kubernetes
    - name: kube-controller-manager
      image: registry.k8s.io/kube-controller-manager
      command:
        - kube-controller-manager
        - --kubeconfig=/etc/kubernetes/kubeconfig
        - --authentication-kubeconfig=/etc/kubernetes/kubeconfig
        - --authorization-kubeconfig=/etc/kubernetes/kubeconfig
        - --authentication-skip-lookup=true
        - --bind-address=0.0.0.0
        - --leader-elect=false
        - --controller-shutdown-timeout=0
        - --use-service-account-credentials=false
        - --tls-cert-file=/etc/kubernetes/ca.crt
        - --tls-private-key-file=/etc/kubernetes/ca.key
        - --client-ca-file=/etc/kubernetes/ca.crt
        - --service-account-private-key-file=/etc/kubernetes/ca.key
        - --root-ca-file=/etc/kubernetes/ca.crt
        - --cluster-signing-cert-file=/etc/kubernetes/ca.crt
        - --cluster-signing-key-file=/etc/kubernetes/ca.key
      volumeMounts:
        - name: etc-kubernetes
          mountPath: /etc/kubernetes
    - name: scheduler
      image: registry.k8s.io/kube-scheduler
      command:
        - kube-scheduler
        - --kubeconfig=/etc/kubernetes/kubeconfig
        - --authentication-kubeconfig=/etc/kubernetes/kubeconfig
        - --authorization-kubeconfig=/etc/kubernetes/kubeconfig
        - --authentication-skip-lookup=true
        - --bind-address=0.0.0.0
        - --leader-elect=false
        - --tls-cert-file=/etc/kubernetes/ca.crt
        - --tls-private-key-file=/etc/kubernetes/ca.key
        - --client-ca-file=/etc/kubernetes/ca.crt
      volumeMounts:
        - name: etc-kubernetes
          mountPath: /etc/kubernetes
  volumes:
    - name: etc-kubernetes
      hostPath:
        path: /etc/kubernetes
        type: Directory
