apiVersion: v1
kind: ConfigMap
metadata:
  name: test-cm
data:
  greeting: hello
  target: world
---
apiVersion: v1
kind: Pod
metadata:
  name: configmap-test
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: busybox
    image: busybox:latest
    command: ["sleep", "3600"]
    volumeMounts:
    - name: cm
      mountPath: /mnt/configmap
      readOnly: true
  volumes:
  - name: cm
    configMap:
      name: test-cm
