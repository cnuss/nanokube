apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sanity
spec:
  description: Smoke test that creates a Namespace and asserts it becomes Active.
  steps:
    - name: create-and-assert-namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: chainsaw-sanity
        - assert:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: chainsaw-sanity
              status:
                phase: Active
