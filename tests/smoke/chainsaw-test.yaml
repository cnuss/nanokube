apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: smoke
spec:
  description: Apply the chainsaw-kube smoke manifest and assert the deployment becomes available.
  steps:
    - name: assert-hostname
      description: assert that the tunnel hostname is set properly
      try:
        - script:
            content: |
              set -x
              CTX=$(kubectl config current-context)
              CLUSTER=$(kubectl config view -o jsonpath="{.contexts[?(@.name=='$CTX')].context.cluster}")
              SERVICE="https://$(kubectl get service kubernetes -n default -o jsonpath='{.spec.externalName}')"
              KUBELET="https://$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalDNS")].address}')"
              KUBECONFIG=$(kubectl config view -o jsonpath="{.clusters[?(@.name=='$CLUSTER')].cluster.server}")
              test "$SERVICE" = "$KUBELET"
              test "$SERVICE" = "$KUBECONFIG"
            check:
              ($error == null): true
    - name: apply-smoke-resources
      try:
        - apply:
            file: https://raw.githubusercontent.com/cnuss/chainsaw-kube/refs/heads/main/smoke/resources.yaml
    - name: assert-deployment-available
      description: deployment assertions
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: smoke-deploy
              status:
                availableReplicas: 1
                readyReplicas: 1
    - name: assert-events
      description: kubctl receives events
      try:
        - script:
            content: |
              kubectl get events -w -n $NAMESPACE --no-headers -o custom-columns=MESSAGE:.message | grep -m2 "Container started"
            check:
              ($error == null): true
    - name: assert-pod-logs
      description: kubectl logs assertions
      try:
        - script:
            content: |
              line=$(kubectl logs -n $NAMESPACE -l app=smoke-deploy -c assert --tail=1)
              test "$line" = "all checks passed, creating /mnt/pvc/ok"
            check:
              ($error == null): true
        - script:
            content: |
              kubectl logs -n $NAMESPACE -l app=smoke-deploy -c httpd --follow --tail=0 | grep -m2 "response:200"
            check:
              ($error == null): true
    - name: assert-exec
      description: kubectl exec assertions
      try:
        - script:
            content: |
              kubectl exec -n $NAMESPACE deployment/smoke-deploy -c assert -- echo ok
            check:
              ($error == null): true
        - script:
            content: |
              kubectl exec -n $NAMESPACE deployment/smoke-deploy -c assert -- sh -c '>&2 echo ok' 2>&1 >/dev/null
            check:
              ($error == null): true
        - script:
            content: |
              echo ok | kubectl exec -i -n $NAMESPACE deployment/smoke-deploy -c assert -- cat
            check:
              ($error == null): true
        - script:
            content: |
              kubectl exec -n $NAMESPACE deployment/smoke-deploy -c assert -- sh -c 'exit 7' || test $? -eq 7
            check:
              ($error == null): true
    - name: assert-attach
      description: kubectl attach assertions
      try:
        - script:
            content: |
              kubectl attach -n $NAMESPACE deployment/smoke-deploy -c httpd 2>&1 | grep -m2 "response:200"
            check:
              ($error == null): true
