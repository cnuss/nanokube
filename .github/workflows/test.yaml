name: Run Tests

on:
  push:
    branches: ["1.35"]
  pull_request:
    branches: ["1.35"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        runner: [ubuntu-latest, macos26-lima]
        suite: [critest, e2e]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-bin-${{ matrix.runner }}-${{ hashFiles('**/go.sum') }}

      - run: make init

      - run: make ${{ matrix.suite }} V=1
