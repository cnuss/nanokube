apiVersion: v1
kind: Secret
metadata:
  name: test-secret
stringData:
  username: admin
  password: s3cret
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-test
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: busybox
    image: busybox:latest
    command: ["sleep", "3600"]
    volumeMounts:
    - name: sec
      mountPath: /mnt/secret
      readOnly: true
  volumes:
  - name: sec
    secret:
      secretName: test-secret
