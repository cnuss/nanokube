name: Run Tests

on:
  push:
    branches: ["1.35"]
  pull_request:
    branches: ["1.35"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        runner:
          # - ubuntu-latest
          - macos-26-intel
        suite: [reviewable]
        runtime: [docker]
        rootless: [true, false]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - uses: docker/setup-docker-action@v5
        if: matrix.runtime == 'docker'
        with:
          rootless: ${{ matrix.rootless }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: go-bin-${{ matrix.runner }}-${{ hashFiles('**/go.sum') }}

      - run: make init

      - run: make ${{ matrix.suite }} V=1
