name: Build

on:
  push:
    branches: ["1.35"]
    paths-ignore:
      - .github/workflows/inspect.yaml
  pull_request:
    branches: ["1.35"]
    paths-ignore:
      - .github/workflows/inspect.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/calls/.build.yaml

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nanokube-*
          path: artifacts
          merge-multiple: true

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          allowUpdates: true
          removeArtifacts: true
          artifacts: artifacts/*
