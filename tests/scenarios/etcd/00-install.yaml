apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: etcd-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: etcd
spec:
  hostNetwork: true
  containers:
  - name: etcd
    image: registry.k8s.io/etcd:3.5.16-0
    command:
    - etcd
    - --data-dir=/var/lib/etcd
    - --listen-client-urls=http://0.0.0.0:12379
    - --advertise-client-urls=http://127.0.0.1:12379
    - --listen-peer-urls=http://0.0.0.0:12380
    - --initial-advertise-peer-urls=http://127.0.0.1:12380
    - --initial-cluster=default=http://127.0.0.1:12380
    volumeMounts:
    - name: data
      mountPath: /var/lib/etcd
    livenessProbe:
      exec:
        command: ["etcdctl", "--endpoints=http://127.0.0.1:12379", "endpoint", "health"]
      initialDelaySeconds: 5
      periodSeconds: 10
    readinessProbe:
      exec:
        command: ["etcdctl", "--endpoints=http://127.0.0.1:12379", "endpoint", "health"]
      initialDelaySeconds: 3
      periodSeconds: 5
    lifecycle:
      preStop:
        exec:
          command: ["etcdctl", "--endpoints=http://127.0.0.1:12379", "member", "list"]
  - name: monitor
    image: busybox:latest
    command:
    - sh
    - -c
    - |
      while ! wget -q -O /dev/null http://127.0.0.1:12379/health 2>/dev/null; do
        sleep 1
      done
      echo healthy > /tmp/etcd-health
      sleep 3600
  - name: crasher
    image: busybox:latest
    command: ["sh", "-c", "exit 1"]
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: etcd-data
