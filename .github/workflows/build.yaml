name: Build

on:
  push:
    branches: ["1.35"]
    paths-ignore:
      - .github/workflows/inspect.yaml
  pull_request:
    branches: ["1.35"]
    paths-ignore:
      - .github/workflows/inspect.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26
          - macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: go-bin-${{ matrix.runner }}-${{ hashFiles('**/go.sum') }}

      - run: make init

      - run: make build

      - id: platform
        run: echo "name=nanokube-${{ github.ref_name }}-$(uname -s)-$(uname -m)" >> "$GITHUB_OUTPUT"

      - run: mv nanokube ${{ steps.platform.outputs.name }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.platform.outputs.name }}
          path: ${{ steps.platform.outputs.name }}

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          allowUpdates: true
          removeArtifacts: true
          artifacts: artifacts/*
