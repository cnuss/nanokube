name: Setup Docker
description: Setup a container runtime with configurable VM backend

inputs:
  runtime:
    description: "Container runtime: docker, containerd, or podman"
    required: false
    default: docker

runs:
  using: composite
  steps:
    - name: Setup Docker on Linux
      if: inputs.runtime == 'docker' && runner.os == 'Linux'
      shell: bash
      run: |
        echo "Using native Docker on Linux"
        ls -la /dev/kvm 2>/dev/null && echo "KVM available" || echo "KVM not available"

    - name: Setup Docker on macOS
      if: inputs.runtime == 'docker' && runner.os == 'macOS'
      shell: bash
      run: |
        brew install colima docker kubectl go

        COLIMA_ARGS="--runtime docker"
        HV=$(sysctl -n kern.hv_vmx_support 2>/dev/null || sysctl -n kern.hv_support 2>/dev/null || echo 0)
        if [[ "$HV" != "1" ]]; then
          brew install qemu
          Q=$(which qemu-system-aarch64 || which qemu-system-x86_64)
          sudo mv "$Q" "$Q.real"
          printf '#!/bin/bash\na=(); for x; do [[ $x = host ]] && x=max; a+=("${x//accel=hvf/accel=tcg}"); done\nexec "%s.real" "${a[@]}"\n' "$Q" | sudo tee "$Q" >/dev/null
          sudo chmod +x "$Q"
          COLIMA_ARGS="$COLIMA_ARGS --vm-type=qemu"
        fi

        CPUS=$(sysctl -n hw.ncpu)
        MEM=$(( $(sysctl -n hw.memsize) / 1073741824 ))
        colima start $COLIMA_ARGS --cpu $CPUS --memory $MEM

    - name: Unsupported runtime
      if: inputs.runtime != 'docker'
      shell: bash
      run: |
        echo "::error::Unsupported runtime: ${{ inputs.runtime }}"
        exit 1

    - name: Wait for Docker to be ready
      if: inputs.runtime == 'docker'
      shell: bash
      run: |
        for i in $(seq 1 300); do
          docker system info >/dev/null 2>&1 && break
          sleep 1
        done
        docker system info
        docker run --rm hello-world
