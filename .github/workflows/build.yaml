name: Build

on:
  push:
    branches: ["1.36"]
  pull_request:
    branches: ["1.36"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: cnuss/nanokube/.github/actions/test@github
        with:
          suite: smoke
          log-name: nanokube-log-ubuntu-24.04-smoke

  build:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26
          - macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: cnuss/nanokube/.github/actions/build@github
        with:
          runner: ${{ matrix.runner }}

  collect:
    outputs:
      artifacts: ${{ steps.collect.outputs.artifacts }}
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - id: collect
        uses: cnuss/nanokube/.github/actions/collect@github

  release:
    needs: collect
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: nanokube-${{ github.ref_name }}-*
          path: artifacts
          merge-multiple: true

      - id: version
        run: |
          BIN=./artifacts/nanokube-${{ github.ref_name }}-$(uname -s)-$(uname -m)
          chmod +x "$BIN"
          echo "version=$("$BIN" --version | sed 's/^Kubernetes //')" >> "$GITHUB_OUTPUT"

      # ncipollo/release-action's allowUpdates refreshes the release assets but
      # leaves the git tag pinned to its original commit, so each release below
      # force-moves its tag to this push first.

      # Rolling prerelease keyed on the branch, carrying the branch-named assets
      # (nanokube-<branch>-<OS>-<ARCH>). Lets the action install a branch ref by
      # download instead of building from source.
      - name: Move branch tag to current commit
        run: |
          git tag -f "${{ github.ref_name }}"
          git push -f origin "refs/tags/${{ github.ref_name }}"

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: artifacts/*

      # Rename the assets to the captured version and cut the versioned release.
      - name: Rename assets to version
        run: |
          for f in ./artifacts/nanokube-${{ github.ref_name }}-*; do
            mv "$f" "${f/nanokube-${{ github.ref_name }}-/nanokube-${{ steps.version.outputs.version }}-}"
          done

      - name: Move version tag to current commit
        run: |
          git tag -f "${{ steps.version.outputs.version }}"
          git push -f origin "refs/tags/${{ steps.version.outputs.version }}"

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: artifacts/*
