apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  # Resolve the service name "web" from the client pod via Docker DNS
  - script: |
      echo "--- resolving 'web' from dns-client ---"
      ip=$(kubectl exec --namespace $NAMESPACE dns-client -- nslookup web 2>/dev/null | grep -A1 "Name:" | tail -1 | awk '{print $2}')
      echo "web resolved to: $ip"
      test -n "$ip"
  # Verify we can reach the nginx service by name
  - script: |
      echo "--- fetching http://web from dns-client ---"
      kubectl exec --namespace $NAMESPACE dns-client -- wget -qO- http://web:80 2>/dev/null | head -5
