apiVersion: v1
kind: Pod
metadata:
  name: downwardapi-test
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: busybox
    image: busybox:latest
    command: ["sleep", "3600"]
    volumeMounts:
    - name: dapi
      mountPath: /mnt/downwardapi
      readOnly: true
  volumes:
  - name: dapi
    downwardAPI:
      items:
      - path: pod-name
        fieldRef:
          fieldPath: metadata.name
      - path: pod-namespace
        fieldRef:
          fieldPath: metadata.namespace
