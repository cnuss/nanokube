name: Run Tests

on:
  push:
    branches: ["1.35"]
  pull_request:
    branches: ["1.35"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip-tests]') }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26
          - macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: cnuss/nanokube/.github/actions/build@github
        with:
          runner: ${{ matrix.runner }}

  collect:
    outputs:
      artifacts: ${{ steps.collect.outputs.artifacts }}
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - id: collect
        uses: cnuss/nanokube/.github/actions/collect@github

  test:
    needs: [collect]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26
          - macos-26-intel
        suite:
          - smoke
          # - sanity
    steps:
      - uses: cnuss/nanokube/.github/actions/test@github
        with:
          suite: ${{ matrix.suite }}
          artifact: ${{ fromJSON(needs.collect.outputs.artifacts)[matrix.runner] }}
          log-name: nanokube-log-${{ matrix.runner }}-${{ matrix.suite }}
          chainsaw-args: ${{ runner.os == 'macOS' && '--apply-timeout=1h --assert-timeout=1h --cleanup-timeout=1h --delete-timeout=1h --error-timeout=1h --exec-timeout=1h' || '' }}
