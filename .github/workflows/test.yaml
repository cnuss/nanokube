name: Run Tests

on:
  push:
    branches: ["1.35"]
    paths-ignore:
      - .github/workflows/inspect.yaml
  pull_request:
    branches: ["1.35"]
    paths-ignore:
      - .github/workflows/inspect.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26
          - macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: ./.github/actions/build
        with:
          runner: ${{ matrix.runner }}

  collect:
    outputs:
      artifacts: ${{ steps.artifacts.outputs.map }}
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-meta-*
          path: meta
          merge-multiple: true
      - id: artifacts
        run: |
          map=$(jq -sc 'reduce .[] as $item ({}; . + {($item.runner): $item.artifact})' meta/*.json)
          echo "map=$map" >> "$GITHUB_OUTPUT"

  linux:
    needs: collect
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite:
          - smoke
          # - sanity
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: ./.github/actions/test
        with:
          suite: ${{ matrix.suite }}
          artifact: ${{ fromJSON(needs.collect.outputs.artifacts)['ubuntu-24.04'] }}
          log-name: nanokube-log-${{ matrix.suite }}

  cross-platform:
    needs: [collect, linux]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04-arm
          - macos-26
          - macos-26-intel
        suite:
          - smoke
          # - sanity
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: ./.github/actions/test
        with:
          suite: ${{ matrix.suite }}
          artifact: ${{ fromJSON(needs.collect.outputs.artifacts)[matrix.runner] }}
          log-name: nanokube-log-${{ matrix.runner }}-${{ matrix.suite }}
