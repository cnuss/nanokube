apiVersion: v1
kind: Pod
metadata:
  name: init-test
spec:
  initContainers:
  - name: init
    image: busybox:latest
    command: ["sh", "-c", "echo initialized > /work/status"]
    volumeMounts:
    - name: work
      mountPath: /work
  containers:
  - name: main
    image: busybox:latest
    command: ["sleep", "3600"]
    volumeMounts:
    - name: work
      mountPath: /work
  volumes:
  - name: work
    emptyDir: {}
