apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  # node is Ready
  - script: kubectl get nodes -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].status}' | grep -q True
  # node has standard kubernetes labels
  - script: kubectl get nodes -o jsonpath='{.items[0].metadata.labels.kubernetes\.io/os}' | grep -q linux
  - script: kubectl get nodes -o jsonpath='{.items[0].metadata.labels.kubernetes\.io/arch}' | grep -q .
