name: Run Tests

on:
  push:
    branches: ["1.35"]
    paths-ignore:
      - .github/workflows/inspect.yaml
  pull_request:
    branches: ["1.35"]
    paths-ignore:
      - .github/workflows/inspect.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/.build.yaml

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: ./.github/actions/run-test
        with:
          suite: smoke
          artifact: ${{ fromJSON(needs.build.outputs.artifacts)['ubuntu-24.04'] }}
          log-name: nanokube-log-smoke

  conformance:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [critest, e2e]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: ./.github/actions/run-test
        with:
          suite: ${{ matrix.suite }}
          artifact: ${{ fromJSON(needs.build.outputs.artifacts)['ubuntu-24.04'] }}
          log-name: nanokube-log-${{ matrix.suite }}

  cross-platform-smoke:
    needs: [build, conformance]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04-arm
          - macos-26
          - macos-26-intel
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: ./.github/actions/run-test
        with:
          suite: smoke
          artifact: ${{ fromJSON(needs.build.outputs.artifacts)[matrix.runner] }}
          log-name: nanokube-log-${{ matrix.runner }}-smoke

  cross-platform-full:
    needs: [build, cross-platform-smoke]
    runs-on: ${{ matrix.runner }}
    # macos runners are currently too slow for the full e2e suite
    if: matrix.suite == 'e2e' && matrix.runner != 'ubuntu-24.04-arm'
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04-arm
          - macos-26
          - macos-26-intel
        suite: [critest, e2e]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: ./.github/actions/run-test
        with:
          suite: ${{ matrix.suite }}
          artifact: ${{ fromJSON(needs.build.outputs.artifacts)[matrix.runner] }}
          log-name: nanokube-log-${{ matrix.runner }}-${{ matrix.suite }}
