name: Run Test
description: Download artifact, start nanokube, run a chainsaw suite, upload logs

inputs:
  suite:
    description: "Chainsaw test suite under tests/ (e.g. smoke, sanity)"
    required: true
  artifact:
    description: "Name of the build artifact to download. If omitted, builds from source via 'make run'"
    required: false
    default: ""
  log-name:
    description: "Name for the uploaded log artifact"
    required: true
  chainsaw-args:
    description: "Extra arguments forwarded to chainsaw (e.g. --assert-timeout=1h)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - uses: cnuss/nanokube/.github/actions/setup@github

    - if: inputs.artifact != ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact }}

    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - uses: actions/cache@v5
      with:
        path: ~/go/bin
        key: go-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}

    - shell: bash
      run: |
        if [ -n "${{ inputs.artifact }}" ]; then
          make build ARTIFACT=${{ inputs.artifact }}
          ./nanokube start -v=2
        else
          make run ARGS="start -v=2"
        fi

    - shell: bash
      run: |
        if [ -n "${{ inputs.artifact }}" ]; then
          log=$(./nanokube status -o json | jq -r '.log_file')
        else
          log=$(make -s run ARGS='status -o json' 2>/dev/null | jq -r '.log_file')
        fi
        echo "NANOKUBE_LOG=$log" >> "$GITHUB_ENV"

    - shell: bash
      run: make test SUITE=${{ inputs.suite }} CHAINSAW_ARGS="${{ inputs.chainsaw-args }}"

    - if: always()
      shell: bash
      run: |
        if [ -n "${{ inputs.artifact }}" ]; then
          ./nanokube stop || true
        else
          make run ARGS="stop -v=2" || true
        fi

    - if: always()
      shell: bash
      run: |
        mkdir -p nanokube-logs
        cp "$NANOKUBE_LOG" nanokube-logs/ 2>/dev/null || true

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ inputs.log-name }}
        path: nanokube-logs
